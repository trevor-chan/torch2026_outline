[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-interpolation"
version = "0.1.0"
description = "Implicit scene reconstruction from sparse dynamic k-space observations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "einops>=0.7",
    "imageio-ffmpeg>=0.4",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10",
    "psutil>=5.9",
    "scipy>=1.10",
    "tensorboard>=2.15",
    "torch>=2.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flow-interpolation = "flow_interpolation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
